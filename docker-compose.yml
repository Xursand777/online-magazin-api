# ═══════════════════════════════════════════════════════════════════════════
#  Bozor — Production orkestratsiya (Hetzner VPS)
#
#  Servislar:  db (Postgres) · redis · web (Gunicorn) · worker · beat · nginx
#  Ishga tushirish:   docker compose up -d --build
#  Loglar:            docker compose logs -f web
#  Yangilash:         git pull && docker compose up -d --build
#
#  Barcha sozlamalar:  backend/.env  (DEPLOYMENT_HETZNER.md'dagi shablon)
# ═══════════════════════════════════════════════════════════════════════════
name: bozor

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    restart: always
    env_file: ./backend/.env          # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"                        # Faqat ichki tarmoq — tashqariga ochilmaydi

  # ── Redis (kesh + Celery broker) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  # ── Django (Gunicorn) ──────────────────────────────────────────────────────
  web:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    # web servisi migrate + collectstatic ni bajaradi (worker/beat emas — race yo'q)
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --max-requests 1000 --max-requests-jitter 100 --timeout 120 --access-logfile - --error-logfile -"
    volumes:
      - media:/app/media          # Mahsulot rasmlari — doimiy (konteyner o'chsa ham yo'qolmaydi)
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: localhost", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    expose:
      - "8000"

  # ── Celery worker (SMS, fon vazifalar) ─────────────────────────────────────
  worker:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    command: celery -A core worker --loglevel=info --concurrency=2
    volumes:
      - media:/app/media
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
      web:   { condition: service_healthy }

  # ── Celery beat (rejalashtirilgan vazifalar) ───────────────────────────────
  beat:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    command: celery -A core beat --loglevel=info
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
      web:   { condition: service_healthy }

  # ── Nginx (Cloudflare origin — SSL, buferlash, rate-limit) ─────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  redisdata:
  media:
