# ═══════════════════════════════════════════════════════════════════════════
#  700mobile.uz — SPA (React frontend) — Hetzner static hosting
#
#  Cloudflare SSL rejimi:  Full (strict)
#  Origin sertifikat:      Cloudflare Origin Certificate (15 yil, bepul)
#                          → *.700mobile.uz + 700mobile.uz qamrab oladi
#
#  STATIK FAYLLAR:
#    deploy/nginx/site.conf bo'lim — `/usr/share/nginx/html` ichida
#    docker-compose'ning `frontend-dist` volume orqali host'dagi
#    `/opt/bozor/frontend/dist` papkasi mount qilinadi.
#
#  KESH STRATEGIYASI:
#    • /assets/*  (Vite content-hash bilan)  → 1 yil immutable
#    • index.html (SPA shell)                → no-cache (har deploy'da yangi)
#    • boshqa fayllar (favicon, og-cover)    → 1 soat
# ═══════════════════════════════════════════════════════════════════════════

# HTTP → HTTPS (Cloudflare odatda HTTPS yuboradi, bu zaxira)
server {
    listen 80;
    server_name 700mobile.uz www.700mobile.uz;
    return 301 https://700mobile.uz$request_uri;
}

# www → apex redirect (SEO va xayfsizlik)
server {
    listen 443 ssl;
    http2 on;
    server_name www.700mobile.uz;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://700mobile.uz$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 700mobile.uz;

    # ── SSL (Cloudflare Origin Certificate, *.700mobile.uz qamrab oladi) ─────
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_FE:10m;
    ssl_session_timeout 1d;

    # Xavfsizlik header'lari — frontend uchun ham
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Brotli/gzip — Vite katta JS chunk'lari uchun zarur
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    root /usr/share/nginx/html;
    index index.html;

    # ── 1) Hashed assets — abadiy cache (Vite content-hash kafolatlangan) ────
    # /assets/index-DiezylKg.js kabi fayllar — har deploy'da yangi nom oladi,
    # shu sababli xavfsiz tarzda 1 yil cache qilamiz (immutable).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── 2) Sayt kornisi (favicon.svg, og-cover.png va h.k.) — 1 soat ──────────
    location ~* \.(svg|png|jpg|jpeg|ico|webp|gif|woff2|woff|ttf)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ── 3) SPA fallback — barcha boshqa yo'llar index.html ga ───────────────
    # React Router routing'ni hal qiladi. index.html'ning O'ZI cache qilinmaydi
    # (no-cache) — har deploy'da yangi bundle hash bilan kelishi shart.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── 4) Health check (UptimeRobot/CF) — index.html'siz tezroq ────────────
    location = /healthz {
        access_log off;
        return 200 'OK\n';
        add_header Content-Type text/plain;
    }

    # Yashirin maxfiy fayllar (kelajakda .git, .env oshkor bo'lmasin)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
