# ═══════════════════════════════════════════════════════════════════════════
#  api.700mobile.uz — reverse proxy (Cloudflare origin)
#
#  Cloudflare SSL rejimi:  Full (strict)
#  Origin sertifikat:      Cloudflare Origin Certificate (15 yil, bepul)
#                          → deploy/nginx/certs/origin.pem + origin.key
# ═══════════════════════════════════════════════════════════════════════════

upstream django {
    server web:8000;
}

# Burst himoyasi (Cloudflare WAF ustiga ikkinchi qatlam)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# ── Haqiqiy mijoz IP'sini tiklash ──────────────────────────────────────────
# UFW 443'ni FAQAT Cloudflare IP'lariga ochadi → CF-Connecting-IP'ga ishonamiz.
# Aks holda barcha foydalanuvchi bitta (Cloudflare) IP sifatida ko'rinib,
# rate-limit va loglar buziladi.
real_ip_header    CF-Connecting-IP;
set_real_ip_from  0.0.0.0/0;

# HTTP → HTTPS (Cloudflare odatda HTTPS yuboradi; bu zaxira)
server {
    listen 80;
    server_name api.700mobile.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.700mobile.uz;

    # ── SSL (Cloudflare Origin Certificate) ────────────────────────────────
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Yuklamalar (bulk import 10MB + mahsulot rasmlari uchun zaxira)
    client_max_body_size 15m;

    # Xavfsizlik header'lari (Django ham beradi — bu ikkinchi qatlam)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # Health check — log shovqinini o'chiramiz (UptimeRobot/CF tez-tez uradi)
    location = /healthz/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://django;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django SECURE_PROXY_SSL_HEADER buni o'qiydi (HTTPS ekanini biladi)
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;   # Render-style cold start emas, lekin uzun task uchun
        proxy_send_timeout    120s;
    }
}
